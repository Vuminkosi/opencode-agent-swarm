# Release publish — build, verify, and publish to npmjs.org (public npm registry).
#
# Pipeline: GitHub Release "published" (or manual dispatch) -> verify job
# (Bun install, tsc x4, scoped bun test, no live inference) -> publish job
# (npm publish --provenance to https://registry.npmjs.org, private pkgs skipped).
#
# Mirror of `.github/workflows/publish.yml` (GitHub Packages lane) with two
# deliberate differences:
# 1. Auth uses NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN }} (npmjs.org Access Token
#    with scoped publish permission, stored as repo Actions secret `NPM_TOKEN`).
#    The GitHub Packages token stays ONLY in the GitHub Packages workflow — never here.
# 2. Registry is the npmjs.org default (https://registry.npmjs.org). No scope
#    mirror line (`@vuminkosi:registry=...`) is written anywhere; the per-package
#    `npm publish --registry https://registry.npmjs.org` flag overrides the
#    `publishConfig.registry` (currently `https://npm.pkg.github.com`) in each
#    package.json without editing manifests.
#
# Secrets: publishes with NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN }} only.
# The token is never echoed (no `set -x`, no `env` dumps). See docs/publishing.md.
# Provenance (Sigstore/OIDC) needs `id-token: write` on the publish job. [DESIGN:
# npm provenance attestation against the npmjs.org registry is asserted by
# requirement PUBLISH-NPMJS-01; if the registry ever rejects the attestation,
# remove `--provenance` and re-run — verification still gates.]
#
# Scope note: packages are `@vuminkosi/*`. Scope availability on npmjs.org was
# verified unauthenticated via `npm view` (404 = free) for `@vuminkosi/protocol`
# and `@vuminkosi/runtime` against the default registry before this file was
# written. The scope must be owned by the publisher's npm account before the
# first real publish; if a later `npm view` returns a version, STOP — the scope
# is taken and nothing here may publish under it.

name: publish-npmjs

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Least privilege at workflow level; the publish job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: publish-npmjs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (install, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun 1.4.4
        # oven-sh/setup-bun@v2 is Node24-native (action.yml: using node24); no newer Node24 major — keep v2.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node 24 (npm compat)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (all 4 package tsconfigs)
        run: |
          bunx tsc --noEmit -p packages/protocol/tsconfig.json
          bunx tsc --noEmit -p packages/runtime/tsconfig.json
          bunx tsc --noEmit -p packages/adapter-opencode/tsconfig.json
          bunx tsc --noEmit -p packages/plugin/tsconfig.json

      # Scoped suite = FINAL-POSTCOMMIT-01 list. bun:test only; no live
      # inference, no network, no paid resources (e2e uses fake harness +
      # disposable mkdtemp DBs).
      - name: Test (scoped, no live inference)
        run: |
          bun test packages/plugin/src/index.test.ts
          bun test packages/protocol/src/__tests__/ packages/runtime/src/db/__tests__/
          bun test packages/runtime/src/services/__tests__/daemon.test.ts
          bun test packages/runtime/src/config.test.ts
          bun test packages/adapter-opencode/src/__tests__/bridge.test.ts
          bun test packages/runtime/src/services/__tests__/swarm-service.test.ts
          bun test packages/plugin/src/commands/__tests__/swarm-command.test.ts
          bun test examples/two-module-fixture/
          bun test tests/e2e/

  publish:
    name: publish to npmjs.org
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm --provenance (Sigstore/OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun 1.4.4
        # oven-sh/setup-bun@v2 is Node24-native (action.yml: using node24); no newer Node24 major — keep v2.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node 24 (npm compat)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # Default npmjs.org registry — NOT a mirror. No scope mapping is set
          # here or in .npmrc; the publish command's --registry flag below
          # overrides each package.json publishConfig.registry (GPR).
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Writes $HOME/.npmrc with a literal ${NODE_AUTH_TOKEN} reference so the
      # secret stays in the environment and is never written to disk or logs.
      # Intentionally NO `@vuminkosi:registry=...` scope-mirror line: npm
      # resolves the default registry (https://registry.npmjs.org) plus the
      # per-command --registry flag below.
      - name: Configure npmjs.org auth (no secret on disk, no mirror)
        run: |
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"

      # Publishes each workspace package whose package.json is NOT private.
      # Any package marked private is SKIPPED with a logged reason.
      # apps/swarmctl is NOT a workspace and stays in the loop for visibility;
      # while private=true it is skipped (see docs/publishing.md).
      # The explicit --registry flag targets npmjs.org and overrides the GPR
      # publishConfig.registry in package.json manifests (which this lane must
      # NOT edit). Exit code propagates: any real `npm publish` failure fails
      # the job.
      - name: Publish public packages (private packages skipped)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          fail=0
          for PKG in packages/protocol packages/runtime packages/verification packages/adapter-opencode packages/plugin packages/board-terminal packages/git-workspaces apps/swarmctl; do
            if [ ! -f "$PKG/package.json" ]; then
              echo "skip $PKG: no package.json"
              continue
            fi
            PRIVATE=$(node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$PKG/package.json','utf8'));console.log(p.private===true?'true':'false')")
            if [ "$PRIVATE" = "true" ]; then
              echo "skip $PKG: private=true"
              continue
            fi
            echo "publish $PKG"
            (cd "$PKG" && npm publish --provenance --registry https://registry.npmjs.org) || fail=1
          done
          exit $fail
